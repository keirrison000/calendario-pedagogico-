<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antonieta Borges Alves — Calendário Pedagógico</title>

    <meta name="description"
        content="Calendário pedagógico oficial da Escola Antonieta Borges Alves: organização do ano letivo, bimestres e prazos da coordenação.">

    <!-- Tipografia Limpa & Legível (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Estilos Estruturais e Visuais -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <div class="main-wrapper">

            <!-- =====================================================
                 CABEÇALHO SUPERIOR (TOPBAR)
            ====================================================== -->
            <header class="topbar">
                <!-- Coordenação (destaque principal, lado esquerdo) -->
                <div class="topbar-left">
                    <div class="topbar-coord-chip">
                        <div class="avatar-coord">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </div>
                        <div class="topbar-coord-info">
                            <span class="coord-label">Antonieta Borges Alves</span>
                            <span class="coord-sub">Calendário Pedagógico</span>
                        </div>
                    </div>
                </div>

            </header>

            <!-- =====================================================
                 CONTEÚDO PRINCIPAL (CALENDÁRIO & PAINEL LATERAL)
            ====================================================== -->
            <main class="content-area">

                <section class="calendar-main">

                    <!-- NAVEGAÇÃO POR BIMESTRE (5 BOTÕES SÓLIDOS DIRETOS) -->
                    <div class="bimester-bar-card">
                        <div class="bimester-bar-header">
                            <div class="bimester-bar-title">
                                <span>Período Letivo por Bimestre</span>
                            </div>
                        </div>

                        <div class="bimester-nav-group" id="bimesterButtonsContainer">
                            <!-- Gerado dinamicamente via JS -->
                        </div>
                    </div>

                    <!-- NAVEGAÇÃO DE MÊS E ANO (CLARA E DIRETA) -->
                    <div class="calendar-navigation-card">

                        <div class="nav-month-center">
                            <button class="month-nav-btn" id="calendarPrevMonthBtn" title="Mês Anterior">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                                <span id="calendarPrevMonthLabel">Mês Anterior</span>
                            </button>

                            <div class="current-period-display">
                                <span class="period-title" id="currentPeriodTitle">Janeiro</span>
                                <span class="period-year-badge" id="currentPeriodYearBadge">2026</span>
                            </div>

                            <button class="month-nav-btn" id="calendarNextMonthBtn" title="Próximo Mês">
                                <span id="calendarNextMonthLabel">Próximo Mês</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>
                        </div>

                        <div class="nav-right-actions">
                            <div class="view-switcher" id="calendarViewSwitcher">
                                <button class="view-tab-btn active" data-view="month">
                                    Visão Mensal
                                </button>

                                <button class="view-tab-btn" data-view="year">
                                    Visão Anual
                                </button>
                            </div>
                        </div>

                    </div>

                    <!-- GRADE DO CALENDÁRIO COM DIAS SEPARADOS -->
                    <div class="calendar-view-container" id="calendarActiveViewContainer"></div>

                    <!-- LEGENDA DE CORES DAS CATEGORIAS (PARTE INFERIOR) -->
                    <div class="calendar-legend-card">
                        <div class="calendar-legend-header">
                            <span class="calendar-legend-title">
                                Legenda de Categorias e Cores
                            </span>
                        </div>
                        <div class="calendar-legend-items-list" id="calendarCategoriesLegend">
                            <!-- Gerado dinamicamente via JS -->
                        </div>
                    </div>

                </section>

                <!-- =====================================================
                     PAINEL LATERAL (DIRETO E OBJETIVO)
                ====================================================== -->
                <aside class="side-panel">

                    <!-- CARD 1: ANDAMENTO DO PERÍODO LETIVO -->
                    <div class="panel-card">
                        <div class="panel-card-header">
                            <span class="panel-card-title">
                                Andamento do Ano Letivo
                            </span>
                        </div>
                        <div id="bimesterProgressContainer"></div>
                    </div>

                    <!-- CARD 2: PRÓXIMOS COMPROMISSOS -->
                    <div class="panel-card">
                        <div class="panel-card-header">
                            <span class="panel-card-title">
                                Próximos Compromissos
                            </span>
                        </div>
                        <div id="coordinationDeadlinesListContainer"></div>
                    </div>

                </aside>

            </main>

        </div>

    </div>






    <!-- =========================================================
         MODAL — DETALHES DO EVENTO
    ========================================================== -->
    <div class="modal-overlay-backdrop" id="eventDetailsModalOverlay">
        <div class="modal-card">
            <div class="modal-card-header">
                <h3>Detalhes do Compromisso</h3>
                <button class="modal-close-btn" data-close-modal title="Fechar">✕</button>
            </div>

            <div class="modal-card-body" id="eventDetailsModalContent"></div>

            <div class="modal-card-footer">
                <div style="margin-left:auto;"></div>
                <button class="btn btn-primary" data-close-modal>Fechar</button>
            </div>
        </div>
    </div>


    <!-- =========================================================
         MODAL — EVENTOS DO DIA
    ========================================================== -->
    <div class="modal-overlay-backdrop" id="dayEventsModalOverlay">
        <div class="modal-card" style="max-width:520px;">
            <div class="modal-card-header">
                <h3 id="dayEventsModalTitle">Compromissos do Dia</h3>
                <button class="modal-close-btn" data-close-modal title="Fechar">✕</button>
            </div>

            <div class="modal-card-body" id="dayEventsModalContent"></div>

            <div class="modal-card-footer">
                <div style="margin-left:auto;"></div>
                <button class="btn btn-primary" data-close-modal>Fechar</button>
            </div>
        </div>
    </div>


    <!-- TOAST DE NOTIFICAÇÃO -->
    <div class="toast-notification" id="appToastNotification"></div>

    <!-- DADOS DOS EVENTOS E JAVASCRIPT MODULAR -->
    <script src="events_data.js"></script>
    <script src="1.js"></script>

</body>

</html>
